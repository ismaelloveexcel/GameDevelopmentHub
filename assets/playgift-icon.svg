<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <filter id="glow-pink" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow-cyan" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="200" height="200" fill="url(#bgGrad)" rx="40"/>
  
  <!-- Controller cable -->
  <path d="M100 35 Q100 20, 115 18 Q135 15, 140 25" 
        stroke="#00E5FF" stroke-width="4" fill="none" 
        stroke-linecap="round" filter="url(#glow-cyan)"/>
  
  <!-- Controller body (pink neon) -->
  <path d="M55 85 
           Q55 65, 75 62 
           L88 62 
           Q94 52, 100 50 
           Q106 52, 112 62 
           L125 62 
           Q145 65, 145 85 
           L145 105 
           Q145 135, 125 145 
           L115 150 
           Q108 155, 100 155 
           Q92 155, 85 150 
           L75 145 
           Q55 135, 55 105 Z" 
        fill="none" stroke="#FF4081" stroke-width="3" 
        filter="url(#glow-pink)"/>
  
  <!-- D-pad -->
  <g filter="url(#glow-cyan)">
    <rect x="68" y="97" width="20" height="6" rx="1" fill="#00E5FF"/>
    <rect x="75" y="90" width="6" height="20" rx="1" fill="#00E5FF"/>
  </g>
  
  <!-- Action buttons -->
  <g filter="url(#glow-pink)">
    <circle cx="125" cy="90" r="5" fill="none" stroke="#FFEB3B" stroke-width="2"/>
    <circle cx="135" cy="100" r="5" fill="none" stroke="#FF4081" stroke-width="2"/>
    <circle cx="125" cy="110" r="5" fill="none" stroke="#00E5FF" stroke-width="2"/>
    <circle cx="115" cy="100" r="5" fill="none" stroke="#C6FF00" stroke-width="2"/>
  </g>
  
  <!-- Gift bow -->
  <g transform="translate(100, 78)" filter="url(#glow-pink)">
    <path d="M-8 0 Q-12 -6, -5 -7 Q0 -9, 0 -3 Q0 -9, 5 -7 Q12 -6, 8 0" 
          fill="none" stroke="#FF4081" stroke-width="2"/>
    <circle cx="0" cy="0" r="3" fill="#FF4081"/>
  </g>
  
  <!-- PG initials -->
  <text x="100" y="185" text-anchor="middle" 
        font-family="'Courier New', monospace" font-size="20" font-weight="bold"
        fill="#C6FF00" filter="url(#glow-cyan)">
    PG
  </text>
</svg>
