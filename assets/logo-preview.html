<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PlayGift Logo Preview</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 40px;
      padding: 40px;
      font-family: 'Segoe UI', sans-serif;
    }
    .dark-bg {
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
    }
    .light-bg {
      background: #f5f5f5;
    }
    h1 {
      color: #FF4081;
      text-shadow: 0 0 20px rgba(255, 64, 129, 0.5);
    }
    h2 {
      color: #888;
      font-weight: normal;
    }
    .logo-container {
      display: flex;
      gap: 60px;
      flex-wrap: wrap;
      justify-content: center;
      align-items: flex-start;
    }
    .logo-box {
      text-align: center;
    }
    .logo-box img {
      max-width: 100%;
      height: auto;
    }
    .logo-box p {
      color: #00E5FF;
      margin-top: 10px;
      font-size: 14px;
    }
    .variations {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .variation {
      padding: 30px;
      border-radius: 20px;
    }
    .variation.dark {
      background: #1a1a2e;
    }
    .variation.light {
      background: #ffffff;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    }
    .color-palette {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }
    .color-swatch {
      width: 50px;
      height: 50px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 10px;
      font-weight: bold;
      text-shadow: 0 1px 2px rgba(0,0,0,0.5);
    }
  </style>
</head>
<body class="dark-bg">
  <h1>🎮 PlayGift Logo</h1>
  <h2>Neon Gaming Controller with Gift Theme</h2>
  
  <div class="logo-container">
    <div class="logo-box">
      <img src="playgift-logo.svg" alt="PlayGift Full Logo" width="400">
      <p>Full Logo (400x450)</p>
    </div>
    
    <div class="logo-box">
      <img src="playgift-icon.svg" alt="PlayGift Icon" width="200">
      <p>App Icon (200x200)</p>
    </div>
  </div>
  
  <h2>Background Variations</h2>
  <div class="variations">
    <div class="variation dark">
      <img src="playgift-icon.svg" alt="Dark Background" width="150">
      <p style="color: #888; margin-top: 10px;">Dark Mode</p>
    </div>
    <div class="variation light">
      <img src="playgift-icon.svg" alt="Light Background" width="150">
      <p style="color: #666; margin-top: 10px;">Light Mode</p>
    </div>
  </div>
  
  <h2>Brand Colors</h2>
  <div class="color-palette">
    <div class="color-swatch" style="background: #FF4081;">Pink<br>#FF4081</div>
    <div class="color-swatch" style="background: #00E5FF;">Cyan<br>#00E5FF</div>
    <div class="color-swatch" style="background: #7B1FA2;">Purple<br>#7B1FA2</div>
    <div class="color-swatch" style="background: #FFEB3B; color: #333;">Yellow<br>#FFEB3B</div>
    <div class="color-swatch" style="background: #C6FF00; color: #333;">Lime<br>#C6FF00</div>
    <div class="color-swatch" style="background: #1a1a2e;">Dark<br>#1a1a2e</div>
  </div>
</body>
</html>
